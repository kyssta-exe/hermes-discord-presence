[project]
name = "hermes-discord-presence"
version = "1.0.0"
description = "Publish live Hermes agent telemetry (tokens/sec, cache hit rate, context usage) as a Discord bot presence"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "kyssta" }]
keywords = ["hermes", "hermes-agent", "discord", "plugin", "observability", "metrics", "presence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# No runtime dependencies on purpose: discord.py is supplied by the bundled
# discord-platform plugin, and this plugin imports it lazily inside the
# platform-handler factory so register() never needs it installed.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.urls]
Homepage = "https://github.com/kyssta-exe/hermes-discord-presence"
Documentation = "https://hermes-agent.nousresearch.com/docs/developer-guide/plugins"
Issues = "https://github.com/kyssta-exe/hermes-discord-presence/issues"

# The installable plugin lives in ./discord-presence — a flat directory plugin
# (plugin.yaml plus sibling modules), which is what `hermes plugins install`
# copies into ~/.hermes/plugins/. It carries its own pyproject.toml so PM can
# read its dependency declaration at admission time.
#
# It is deliberately a SUBDIRECTORY rather than flattened to the repo root: a
# flat layout puts __init__.py at the root, which makes pytest treat the whole
# repository as a package and fail to collect the tests with "attempted
# relative import with no known parent package". The nested form keeps both
# `hermes plugins install` and `pytest` happy.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
